# EXEMPLO: não aplique este arquivo e não coloque valores reais no Git.
# Crie o segredo de verdade (a pipeline/Terraform da Etapa 7 também pode fazer isso):
#
#   kubectl -n oficina create secret generic execution-service-secrets \
#     --from-literal=JWT_SECRET=...
#
# JWT_SECRET precisa ser o MESMO do OS Service (é ele que emite os tokens).
# O acesso ao DynamoDB, SQS e SNS vem da role IAM do pod (IRSA), não de chaves neste segredo.
apiVersion: v1
kind: Secret
metadata:
  name: execution-service-secrets
  namespace: oficina
type: Opaque
stringData:
  JWT_SECRET: "troque-me-por-um-segredo-com-32-bytes-ou-mais"
